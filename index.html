<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성산맛있네식당 | Seongsan Matitne Restaurant</title>
  <meta name="description" content="성산맛있네식당 공식 링크. 네이버지도, 구글지도, WhatsApp, Facebook 바로가기." />
  <style>
    :root {
      --bg: #f7f3ea;
      --card: #ffffff;
      --text: #1f1f1f;
      --sub: #6d6a63;
      --border: #e7dfd2;
      --accent: #2f5d50;
      --accent-dark: #24483f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 28px 16px;
    }
    .wrap {
      width: 100%;
      max-width: 520px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 20px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: grid;
      place-items: center;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: -0.6px;
    }
    .eng {
      margin-top: 6px;
      text-align: center;
      color: var(--sub);
      font-size: 15px;
    }
    .desc {
      margin: 18px auto 22px;
      text-align: center;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.65;
      max-width: 420px;
    }
    .links {
      display: grid;
      gap: 12px;
    }
    .btn {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 17px;
      font-size: 16px;
      font-weight: 700;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: .15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: #cfc5b5;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
    }
    .icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #f1ede5;
      font-size: 17px;
      flex: 0 0 auto;
    }
    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }
    .primary .icon {
      background: rgba(255,255,255,.16);
    }
    .small {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: #8a867e;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="logo">맛있네</div>
      <h1>성산맛있네식당</h1>
      <div class="eng">Seongsan Matitne Restaurant</div>
      <p class="desc">
        제주 성산의 향토 한식당<br>
        갈치조림 · 대형 갈치구이 · 가정식 반찬 8종 · 무료주차<br>
        Multilingual menu available
      </p>

      <div class="links">
        <a class="btn primary" href="https://map.naver.com/p/entry/place/1268080876" target="_blank" rel="noopener noreferrer">
          <span class="icon">📍</span>
          <span>Naver Maps</span>
        </a>

        <a class="btn" href="https://www.google.com/maps/place/?q=place_id:ChIJcUC0EwATDTURV7wPKPU3ps8" target="_blank" rel="noopener noreferrer">
          <span class="icon">🗺️</span>
          <span>Google Maps</span>
        </a>

        <a class="btn" href="https://wa.me/821052340762" target="_blank" rel="noopener noreferrer">
          <span class="icon">💬</span>
          <span>WhatsApp</span>
        </a>

        <a class="btn" href="https://www.facebook.com/profile.php?id=61595509891365" target="_blank" rel="noopener noreferrer">
          <span class="icon">📘</span>
          <span>Facebook</span>
        </a>
      </div>

      <div class="small">
        성산일출봉 · 섭지코지 인근<br>
        광치기해변 · 우도 여행 동선
      </div>
    </section>
  </main>
</body>
</html>
